[package]
name = "crossterm-app"
version = "2.0.6"
description = "CrossTerm - Cross-Platform Terminal Emulator & Remote Access Suite"
authors = ["Abhishek Lal"]
license = "AGPL-3.0-only"
repository = "https://github.com/alal76/CrossTerm"
edition = "2021"
rust-version = "1.77.2"
# `tauri dev` shells out to `cargo run` with no --bin; adding the
# network-explore-cli binary target made that ambiguous without this.
default-run = "crossterm-app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Standalone Network Explorer runner: exercises the real scan pipeline with
# no Tauri app, no vault unlock, no UI — see src/bin/network-explore-cli.rs.
[[bin]]
name = "network-explore-cli"
path = "src/bin/network-explore-cli.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

# Cryptography
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
# IPMI RAKP+ confidentiality (AES-CBC-128, per IPMI 2.0 spec — separate from
# aes-gcm above, which is AEAD and not what IPMI's RMCP+ session uses)
aes = "0.8"
cbc = "0.1"
# SNMPv3 USM (RFC 3414) — HMAC-MD5-96 is still the more common auth protocol
# in the wild despite being deprecated, so both hashes are supported.
md-5 = "0.10"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# SSH
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "rand_core", "std"] }
async-trait = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-stream = "0.1"

# Serialization
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["reusable_secrets", "static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
data-encoding = "2"
regex = "1"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

# Terminal
portable-pty = "0.8"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5"

# VNC
vnc-rs = "0.5.3"

# RDP
ironrdp = { version = "0.14", features = ["connector", "session", "graphics", "pdu"] }
ironrdp-blocking = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }

# WinRM (NTLM auth) — already pulled in transitively via ironrdp-connector's
# NLA support; declared directly here so winrm can use its client NTLM API.
sspi = "0.18"

# OS Credential Store
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# FIDO2/WebAuthn software authenticator
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

# System
libc = "0.2"
if-addrs = "0.13"
# "all" is required for Socket::bind_device (Linux/Android SO_BINDTODEVICE,
# used by network::bind_socket_to_interface for interface-scoped scans).
socket2 = { version = "0.5", features = ["all"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Network discovery (mDNS/Bonjour + TLS certificate inspection for Network Explorer)
mdns-sd = "0.21.0"
x509-parser = "0.18.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# New protocol support
bytes = "1"
http = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tonic = { version = "0.12", default-features = false, features = ["channel", "tls-roots", "codegen"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
which = "6"

# Clipboard
arboard = "3"
kube = { version = "0.97", default-features = false, features = ["client", "config", "rustls-tls", "ws"] }
k8s-openapi = { version = "0.23", features = ["v1_31"] }
spice-client = { version = "0.2.0", default-features = false }
binrw = "0.15"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
ctor = "1.0.13"

[[bench]]
name = "vault_bench"
harness = false

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
integration = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false
incremental = false

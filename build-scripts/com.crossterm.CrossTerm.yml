app-id: com.crossterm.CrossTerm
# 23.08 is end-of-life (2-year support window); 25.08 is current as of 2026.
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: crossterm
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --share=ipc
  - --filesystem=home
modules:
  - name: crossterm
    buildsystem: simple
    build-commands:
      - cargo build --release --manifest-path src-tauri/Cargo.toml
      # The Cargo package (and its real compiled binary) is named
      # "crossterm-app" (src-tauri/Cargo.toml's [package].name), not
      # "crossterm" — only the Flatpak-exposed command name above is
      # "crossterm".
      - install -Dm755 src-tauri/target/release/crossterm-app /app/bin/crossterm

[package]
name = "crossterm-audit-tui"
version = "0.1.0"
description = "Standalone, headless-friendly TUI for auditing network reachability with CrossTerm's discovery pipeline — no Tauri/GUI dependency."
authors = ["Abhishek Lal"]
license = "AGPL-3.0-only"
repository = "https://github.com/alal76/CrossTerm"
edition = "2021"

[[bin]]
name = "crossterm-audit-tui"
path = "src/main.rs"

[dependencies]
# NOTE: this `crossterm` crate is an unrelated, unaffiliated Rust terminal-
# manipulation library that happens to share the CrossTerm project's name —
# not a conflict, just a naming coincidence worth flagging for anyone
# skimming this file.
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
